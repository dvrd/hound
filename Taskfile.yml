version: '3'

vars:
  VERSION:
    sh: cat VERSION
  LDFLAGS: -s -w -X main.version=v{{.VERSION}}

tasks:
  build:
    desc: Build the hound binary
    cmds:
      - mkdir -p bin
      - go build -ldflags "{{.LDFLAGS}}" -o bin/hound ./cmd/hound

  run:
    desc: 'Build and run with arguments (usage: task run -- wallet status)'
    cmds:
      - task: build
      - ./bin/hound {{.CLI_ARGS}}

  test:
    desc: Run all tests
    cmds:
      - go test ./... -count=1 -short -timeout 60s

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - go test ./... -count=1 -short -timeout 60s -v

  test:watch:
    desc: Run tests in watch mode (requires entr)
    cmds:
      - find cmd internal -name '*.go' | entr -c go test ./... -count=1 -short -timeout 60s

  lint:
    desc: Run go vet on all packages
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin

  install:
    desc: Install to /usr/local/bin
    cmds:
      - task: build
      - sudo cp bin/hound /usr/local/bin/
      - sudo chmod +x /usr/local/bin/hound

  version:
    desc: Display current version
    cmds:
      - echo "v$(cat VERSION)"

  version:major:
    desc: Bump major version (X.0.0) and create git tag
    cmds:
      - |
        current=$(cat VERSION)
        major=$(echo "$current" | cut -d. -f1)
        new="$((major + 1)).0.0"
        echo "$new" > VERSION
        git add VERSION
        git commit -m "chore: bump version to v${new}"
        git tag "v${new}"
        echo "Bumped to v${new}"

  version:minor:
    desc: Bump minor version (0.X.0) and create git tag
    cmds:
      - |
        current=$(cat VERSION)
        major=$(echo "$current" | cut -d. -f1)
        minor=$(echo "$current" | cut -d. -f2)
        new="${major}.$((minor + 1)).0"
        echo "$new" > VERSION
        git add VERSION
        git commit -m "chore: bump version to v${new}"
        git tag "v${new}"
        echo "Bumped to v${new}"

  version:patch:
    desc: Bump patch version (0.0.X) and create git tag
    cmds:
      - |
        current=$(cat VERSION)
        major=$(echo "$current" | cut -d. -f1)
        minor=$(echo "$current" | cut -d. -f2)
        patch=$(echo "$current" | cut -d. -f3)
        new="${major}.${minor}.$((patch + 1))"
        echo "$new" > VERSION
        git add VERSION
        git commit -m "chore: bump version to v${new}"
        git tag "v${new}"
        echo "Bumped to v${new}"

  release:
    desc: Tag and push current version to trigger GoReleaser (requires clean working tree)
    cmds:
      - |
        if [ -n "$(git status --porcelain)" ]; then
          echo "Working tree is dirty. Commit your changes first."
          exit 1
        fi
        version=$(cat VERSION)
        tag="v${version}"
        if git rev-parse "$tag" >/dev/null 2>&1; then
          echo "Tag $tag already exists."
          exit 1
        fi
        git tag "$tag"
        git push origin "$tag"
        echo "Pushed $tag — GitHub Actions will run GoReleaser"

  release:dry:
    desc: Dry-run GoReleaser locally (requires goreleaser installed)
    cmds:
      - goreleaser release --snapshot --clean

  hooks:install:
    desc: Install git pre-commit hook
    cmds:
      - cp hooks/pre-commit .git/hooks/pre-commit
      - chmod +x .git/hooks/pre-commit
      - echo "Pre-commit hook installed"
