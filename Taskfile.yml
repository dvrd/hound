version: '3'

tasks:
  build:
    desc: Build the hound binary
    cmds:
      - mkdir -p bin
      - odin build src/cli -out:bin/hound -o:speed

  debug:
    desc: Build with debug symbols
    cmds:
      - mkdir -p bin
      - odin build src/cli -out:bin/hound_debug -debug

  run:
    desc: 'Build and run with arguments (usage: task run -- aura)'
    cmds:
      - task: default
      - ./bin/hound {{.CLI_ARGS}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin

  install:
    desc: Install to /usr/local/bin
    cmds:
      - task: default
      - sudo cp bin/hound /usr/local/bin/
      - sudo chmod +x /usr/local/bin/hound

  test:
    desc: Run all unit tests
    cmds:
      - odin test tests

  test:decoder:
    desc: Run raydium decoder tests only
    cmds:
      - odin test tests -file:tests/raydium_decoder_test.odin

  test:price:
    desc: Run price fetcher tests only
    cmds:
      - odin test tests -file:tests/price_fetcher_test.odin

  test:config:
    desc: Run config tests only
    cmds:
      - odin test tests -file:tests/token_config_test.odin

  test:integration:
    desc: Run integration tests only
    cmds:
      - odin test tests -file:tests/integration_test.odin

  test:watch:
    desc: Run tests in watch mode (requires entr)
    cmds:
      - find tests src -name "*.odin" | entr -c task test

  menubar:build:
    desc: Build full menu bar app
    cmds:
      - mkdir -p bin
      - odin build src/menubar -out:bin/hound-menubar -o:speed -extra-linker-flags:"-framework AppKit -framework Foundation -lsqlite3"

  menubar:debug:
    desc: Build menu bar app with debug symbols
    cmds:
      - mkdir -p bin
      - odin build src/menubar -out:bin/hound-menubar-debug -debug -extra-linker-flags:"-framework AppKit -framework Foundation -lsqlite3"

  menubar:run:
    desc: Build and run menu bar app immediately
    cmds:
      - task: menubar:build
      - ./bin/hound-menubar

  menubar:install:
    desc: Install menu bar app to /usr/local/bin
    cmds:
      - task: menubar:build
      - sudo cp bin/hound-menubar /usr/local/bin/
      - sudo chmod +x /usr/local/bin/hound-menubar

  menubar:bundle:
    desc: Create Hound.app bundle
    cmds:
      - ./scripts/create_app_bundle.sh

  menubar:dmg:
    desc: Create DMG installer
    deps: [menubar:bundle]
    cmds:
      - ./scripts/create_dmg.sh

  menubar:clean:
    desc: Remove app bundle and DMG
    cmds:
      - rm -rf Hound.app
      - rm -f Hound-*.dmg

  version:
    desc: Display current version
    cmds:
      - cat VERSION

  version:major:
    desc: Bump major version (X.0.0) and create git tag
    cmds:
      - ruby scripts/update_version.rb major

  version:minor:
    desc: Bump minor version (0.X.0) and create git tag
    cmds:
      - ruby scripts/update_version.rb minor

  version:patch:
    desc: Bump patch version (0.0.X) and create git tag
    cmds:
      - ruby scripts/update_version.rb patch

  hooks:install:
    desc: Install git hooks (pre-commit for auto-syncing version.odin)
    cmds:
      - ./scripts/install-hooks.sh
