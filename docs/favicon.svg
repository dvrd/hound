<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#0a0a0f"/>
  <!-- Outer hexagon (cyan) -->
  <polygon points="16,2 28,9 28,21 16,30 4,21 4,9" stroke="rgba(0,245,255,0.7)" stroke-width="1.2" fill="none"/>
  <!-- Inner hexagon (purple) -->
  <polygon points="16,8 22,12 22,20 16,24 10,20 10,12" stroke="rgba(123,47,255,0.9)" stroke-width="1.2" fill="rgba(123,47,255,0.12)"/>
  <!-- Center dot (cyan glow) -->
  <circle cx="16" cy="16" r="3" fill="#00F5FF"/>
</svg>
